<!DOCTYPE html>
<html>

<style>
  body { font-family: sans-serif; margin: 2em; }

</style>
</head>
<body>
<h1 id="title">A page with a script</h1>
<p>Items: <span id="count">0</span></p>
<ul id="list"></ul>
<button id="add">Add</button>
<a id="home" href="/">home</a>
<noscript><p id="noscript">Scripts are off.</p></noscript>
<script src="/app.js"></script>
<script>
  // Inline after the external one: it sees what app.js defined.
  addItem('from inline');
  document.getElementById('title').textContent = 'A page with a script: ' + document.querySelectorAll('#list li').length + ' items';
  console.log('app: ready', document.title, location.pathname);
</script>
