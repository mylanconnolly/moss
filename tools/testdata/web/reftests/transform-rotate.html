<!DOCTYPE html>
<title>transform: rotate(90deg) turns the box clockwise about its centre</title>
<style> body { margin: 0; } .b { position: absolute; left: 100px; top: 50px; width: 40px; height: 80px; transform: rotate(90deg); } .t { height: 40px; background: red; } .u { height: 40px; background: blue; } </style>
<div class="b"><div class="t"></div><div class="u"></div></div>
