<!DOCTYPE html>
<title>position: fixed — the viewport is the containing block, whatever the ancestors</title>
<style>
  body { margin: 0; }
  .rel { position: relative; left: 40px; top: 30px; width: 200px; height: 150px; background: #ddd; }
  .fixed { position: fixed; top: 20px; left: 50px; width: 60px; height: 40px; background: navy; }
  .inner { position: absolute; top: 10px; left: 10px; width: 20px; height: 20px; background: yellow; }
</style>
<div class="rel"><div class="fixed"><div class="inner"></div></div></div>
