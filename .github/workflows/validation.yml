name: Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - run: python3 -m unittest discover -s tools -p test_validate.py
      - run: python3 tools/validate.py host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: zig-out/validation/
          retention-days: 14

  smoke:
    # 26.04 supplies QEMU 10.2; 24.04's QEMU lacks x-flts.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MOSS_LIMINE: ${{ github.workspace }}/zig-out/limine-binary
      MOSS_OVMF: /usr/share/OVMF/OVMF_CODE_4M.fd
      MOSS_OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - name: Install emulator and firmware
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-system-arm ovmf openssl
          mkdir -p zig-out
          curl --fail --location --retry 3 https://github.com/Limine-Bootloader/Limine/releases/download/v12.9.3/limine-binary.tar.xz -o zig-out/limine-binary.tar.xz
          echo 'e02a473c6dc6df25159697f94930272397f21fd86e5d4eeee61bba72c95ec8d2  zig-out/limine-binary.tar.xz' | sha256sum --check
          tar -xJf zig-out/limine-binary.tar.xz -C zig-out
      - name: TCG smoke on both ports
        run: python3 tools/validate.py smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tcg-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: zig-out/validation/
          retention-days: 14

  runtime:
    # Enable after provisioning a dedicated runner with these labels.
    # Self-hosted execution uses trusted default-branch code only.
    if: >-
      vars.MOSS_KVM_RUNNER_ENABLED == 'true' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, moss-amd64]
    timeout-minutes: 45
    concurrency:
      group: moss-runtime
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - name: Full AMD64 KVM and ARM64 TCG gates
        run: python3 tools/validate.py full
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: zig-out/validation/
          retention-days: 14
